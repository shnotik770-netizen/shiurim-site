<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הקפות שניות – חב"ד עפולה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Secular+One&family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#07041a;
    --plum:#3a1260;
    --gold:#ffc93c;
    --gold-deep:#d4901c;
    --wine:#8c1a32;
    --teal:#3ee0d0;
    --cream:#fff4dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;color:var(--cream);font-family:"Heebo","Arial Hebrew",Arial,sans-serif;
    background:radial-gradient(ellipse at 25% 115%,#8a2c6e 0,#4a1668 28%,#1c0b40 60%,var(--night) 100%)}
  body.idle{cursor:none}

  /* ---------- שרשרת נורות ---------- */
  .lights{position:fixed;top:0;left:0;width:100%;height:12vmin;z-index:5;pointer-events:none}
  .lights .bulb{animation:tw 1.8s ease-in-out infinite}
  @keyframes tw{50%{opacity:.35}}

  .bh{position:fixed;top:3vmin;right:3.4vmin;z-index:6;font-family:"Secular One",sans-serif;font-size:3vmin;color:#fff}
  .logo{position:fixed;top:2.6vmin;left:3vmin;z-index:6;background:#fff;padding:.9vmin 1.4vmin;border-radius:1vmin;
    box-shadow:0 0 0 .3vmin var(--gold),0 1vmin 3vmin rgba(0,0,0,.5)}
  .logo img{display:block;height:7vmin;width:auto}

  /* ---------- פריסה ---------- */
  .stage{position:relative;height:calc(100% - var(--tick));display:grid;grid-template-columns:52% 48%;align-items:center}
  :root{--tick:7.5vmin}
  .info{position:relative;z-index:3;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2.2vmin;padding:9vmin 2vmin 2vmin 0}

  .eyebrow{display:flex;align-items:center;gap:1.6vmin;font-family:"Secular One",sans-serif;font-size:3.8vmin;color:var(--teal);letter-spacing:.04em}
  .eyebrow::before,.eyebrow::after{content:"";width:8vmin;height:.35vmin;border-radius:1vmin;background:currentColor;opacity:.7}

  h1{align-self:stretch;font-family:"Karantina",sans-serif;font-weight:700;font-size:24vmin;line-height:.8;white-space:nowrap;margin:1vmin 0 .5vmin;
    color:var(--gold);text-shadow:0 .5vmin 0 var(--gold-deep),0 1vmin 0 #9a5a0c,0 1.6vmin 0 #5c2c06,0 2.6vmin 3vmin rgba(0,0,0,.6),0 0 6vmin rgba(255,201,60,.35)}
  h1 span{display:inline-block;animation:hop 1.4s ease-in-out infinite;animation-delay:calc(var(--i) * .09s)}
  h1 .gap{width:.28em}
  @keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.12em) rotate(-3deg)}}

  .invite{font-weight:900;font-size:3.9vmin;color:var(--night);padding:1vmin 4vmin;border-radius:10vmin;
    background:linear-gradient(90deg,var(--teal),#9cf7ee,var(--teal));box-shadow:0 1vmin 3vmin rgba(62,224,208,.35);transform:rotate(-1.5deg)}

  .tickets{display:grid;grid-template-columns:1.25fr 1.25fr .9fr;gap:1.8vmin;width:100%;max-width:96vmin;margin-top:1.4vmin}
  .tk{position:relative;border-radius:1.8vmin;padding:1.8vmin 1.6vmin 2vmin;background:rgba(255,255,255,.07);
    border:.25vmin dashed rgba(255,201,60,.6);backdrop-filter:blur(4px);display:flex;flex-direction:column;justify-content:center;gap:.6vmin}
  .tk:nth-child(1){transform:rotate(1.5deg)}
  .tk:nth-child(3){transform:rotate(-2deg)}
  .tk small{font-size:2.1vmin;font-weight:800;color:var(--gold);letter-spacing:.05em}
  .tk b{font-family:"Secular One",sans-serif;font-weight:400;font-size:3.3vmin;line-height:1.15;color:#fff}
  .tk span{font-size:2.3vmin;line-height:1.3;opacity:.9}
  .tk .ltr{direction:ltr;unicode-bidi:isolate}
  .tk.time{background:linear-gradient(160deg,var(--gold),#ff9f1c);border:0;color:var(--night);box-shadow:0 1.2vmin 3.6vmin rgba(255,170,40,.4)}
  .tk.time small{color:var(--wine)}
  .tk.time b{font-family:"Heebo",sans-serif;font-weight:900;font-size:7.4vmin;line-height:1;color:var(--night);font-variant-numeric:tabular-nums}

  /* ---------- הבמה עם הריקוד ---------- */
  .scene{position:relative;height:100%;min-height:0}
  .beam{position:absolute;top:-10%;width:30%;height:120%;transform-origin:50% 0;mix-blend-mode:screen;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,230,160,.35),rgba(255,230,160,0) 85%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);
    animation:sweep 7s ease-in-out infinite alternate}
  .beam.a{left:12%}
  .beam.b{right:8%;animation-delay:-3.5s;background:linear-gradient(180deg,rgba(62,224,208,.3),rgba(62,224,208,0) 85%)}
  @keyframes sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
  .floor{position:absolute;left:6%;right:6%;bottom:6%;height:30%;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(255,200,120,.55) 0,rgba(180,80,120,.35) 45%,rgba(40,10,70,0) 72%)}
  .ring{position:absolute;inset:0}
  .dancer{position:absolute;left:0;top:0;will-change:transform}
  .dancer svg{display:block;width:100%;height:100%;overflow:visible}

  /* תנועות הרקדנים */
  .fig{animation:bob .62s ease-in-out infinite alternate;animation-delay:var(--d)}
  .arm-l{transform-origin:30px 78px;animation:armL .62s ease-in-out infinite alternate;animation-delay:var(--d)}
  .arm-r{transform-origin:70px 78px;animation:armR .62s ease-in-out infinite alternate;animation-delay:var(--d)}
  .leg-l{transform-origin:44px 142px;animation:legL .62s ease-in-out infinite alternate;animation-delay:var(--d)}
  .leg-r{transform-origin:56px 142px;animation:legR .62s ease-in-out infinite alternate;animation-delay:var(--d)}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
  @keyframes armL{from{transform:rotate(-28deg)}to{transform:rotate(18deg)}}
  @keyframes armR{from{transform:rotate(22deg)}to{transform:rotate(-24deg)}}
  @keyframes legL{from{transform:rotate(0)}to{transform:rotate(22deg)}}
  @keyframes legR{from{transform:rotate(-20deg)}to{transform:rotate(0)}}

  /* נושא ספר התורה במרכז */
  .bearer{position:absolute;left:50%;bottom:17%;height:62%;aspect-ratio:140/300;transform:translateX(-50%);z-index:50;
    filter:drop-shadow(0 0 3vmin rgba(255,210,120,.55))}
  .bearer svg{width:100%;height:100%;overflow:visible;animation:lift 1.24s ease-in-out infinite}
  @keyframes lift{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3%) rotate(2deg)}}

  /* כלי נגינה מרחפים */
  .inst{position:absolute;z-index:60;filter:drop-shadow(0 1vmin 1.4vmin rgba(0,0,0,.5));animation:float 4.2s ease-in-out infinite}
  .inst svg{display:block;width:100%;height:100%;overflow:visible}
  @keyframes float{0%,100%{transform:translateY(0) rotate(var(--r0))}50%{transform:translateY(-6%) rotate(var(--r1))}}
  .violin{width:8%;aspect-ratio:60/160;top:30%;left:3%;--r0:-24deg;--r1:-14deg}
  .clarinet{width:4.4%;aspect-ratio:30/170;top:10%;right:6%;--r0:22deg;--r1:32deg;animation-delay:-1.2s}
  .trumpet{width:18%;aspect-ratio:170/70;top:14%;left:38%;--r0:-8deg;--r1:4deg;animation-delay:-2.4s}
  .drum{width:15%;aspect-ratio:110/100;bottom:4%;right:2%;--r0:-4deg;--r1:3deg;animation-duration:3s}
  .bow{transform-origin:30px 90px;animation:saw .5s ease-in-out infinite alternate}
  @keyframes saw{from{transform:translate(-6px,4px) rotate(58deg)}to{transform:translate(8px,-6px) rotate(58deg)}}
  .stick-a{transform-origin:20px 8px;animation:tap .3s ease-in-out infinite alternate}
  .stick-b{transform-origin:90px 8px;animation:tap .3s ease-in-out infinite alternate-reverse}
  @keyframes tap{from{transform:rotate(-14deg)}to{transform:rotate(8deg)}}

  .note{position:absolute;z-index:70;font-family:"Heebo",sans-serif;font-weight:900;pointer-events:none;
    animation:noteUp linear forwards;text-shadow:0 0 1.4vmin currentColor}
  @keyframes noteUp{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.6)}15%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),-38vmin) rotate(var(--rot)) scale(1.1)}}

  /* ---------- סרט רץ ---------- */
  .ticker{position:fixed;left:0;right:0;bottom:0;height:var(--tick);z-index:8;overflow:hidden;display:flex;align-items:center;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-deep));box-shadow:0 -1vmin 3vmin rgba(0,0,0,.45)}
  .ticker .track{display:flex;width:max-content;animation:tick 28s linear infinite}
  .ticker .run{display:flex;align-items:center;white-space:nowrap;font-family:"Secular One",sans-serif;font-size:3.6vmin;color:var(--night)}
  .ticker .run i{font-style:normal;margin:0 3vmin;color:var(--wine)}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }

  /* ---------- מסך לאורך ---------- */
  @media (max-aspect-ratio:1/1){
    .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .info{padding:12vmin 4vmin 0}
    h1{font-size:26vmin}
    .tickets{max-width:none}
    .scene{min-height:40vh}
    .trumpet{top:4%;width:22%}
    .clarinet{top:2%}
  }
</style>
</head>

  <div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

<script>
(function(){
  /* כותרת – כל אות קופצת בנפרד */
  var t = document.getElementById('title'), txt = t.textContent, html = '';
  for(var i = 0; i < txt.length; i++){
    html += txt[i] === ' ' ? '<span class="gap"></span>' : '<span style="--i:' + i + '" aria-hidden="true">' + txt[i] + '</span>';
  }
  t.innerHTML = html;
  /* הכותרת ממלאת את רוחב העמודה בלי לגלוש */
  function fitTitle(){
    t.style.fontSize = '';
    var max = t.clientWidth, w = t.scrollWidth;
    if(w > max) t.style.fontSize = (parseFloat(getComputedStyle(t).fontSize) * max / w * 0.97) + 'px';
  }
  fitTitle();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  window.addEventListener('resize', fitTitle);

  /* שרשרת נורות */
  var L = document.getElementById('lights'), W = 1000, H = 100, s = '';
  L.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var COLORS = ['#ffc93c','#3ee0d0','#ff5c8a','#fff4dc','#8fd14f'];
  [[0, 250, 55], [250, 500, 45], [500, 750, 55], [750, 1000, 45]].forEach(function(seg, k){
    var x0 = seg[0], x1 = seg[1], sag = seg[2];
    s += '<path d="M' + x0 + ' 6 Q' + (x0+x1)/2 + ' ' + (6+sag*2) + ' ' + x1 + ' 6" stroke="#2a1a10" stroke-width="1.4" fill="none"/>';
    for(var j = 1; j < 9; j++){
      var u = j/9, x = x0 + (x1-x0)*u, y = 6 + (1-(2*u-1)*(2*u-1))*sag;
      s += '<ellipse class="bulb" cx="' + x + '" cy="' + (y+5) + '" rx="3.2" ry="5" fill="' + COLORS[(j+k)%5] +
           '" style="animation-delay:' + (-(j*0.37+k)%1.8).toFixed(2) + 's;filter:drop-shadow(0 0 4px ' + COLORS[(j+k)%5] + ')"/>';
    }
  });
  L.innerHTML = s;

  /* סרט רץ */
  var run = '<div class="run">' + ['שמחה וריקודים עד בלי די!','כולם מוזמנים – אנשים, נשים וטף','מוצאי שמחת תורה · משעה 21:30','בית הכנסת חב״ד המרכזי, שד׳ ארלוזורוב 31']
    .map(function(x){ return '<span>' + x + '</span><i>✦</i>'; }).join('') + '</div>';
  document.getElementById('track').innerHTML = run + run;

  /* ----- מעגל החסידים הרוקדים ----- */
  var SKIN = ['#f1c9a5','#e8b48c','#f6d3b3','#d9a27a'];
  var BEARD = ['#1c140e','#5a3418','#a8522a','#8c8c8c','#2d1c10'];
  function dancer(o){
    var beard = o.kid ? '' : '<path d="M38 58 Q40 82 50 86 Q60 82 62 58 Q56 66 50 66 Q44 66 38 58 Z" fill="' + o.beard + '"/>';
    var hat = o.kid
      ? '<path d="M40 46 Q50 36 60 46 Z" fill="#1d2b6b"/>'
      : '<ellipse cx="50" cy="43" rx="21" ry="4.5" fill="#0b0b10"/><path d="M36 43 L38 25 Q50 19 62 25 L64 43 Z" fill="#0b0b10"/><rect x="36.5" y="38" width="27" height="2.6" fill="#2d2d38"/>';
    var body = o.kid
      ? '<path d="M32 72 Q50 67 68 72 L72 142 Q50 147 28 142 Z" fill="#fff"/><path d="M34 74 L44 74 L42 140 L30 140 Z M56 74 L66 74 L70 140 L58 140 Z" fill="#15151b"/>'
      : '<path d="M30 72 Q50 66 70 72 L78 152 Q50 158 22 152 Z" fill="#15151b"/><path d="M44 70 L56 70 L50 92 Z" fill="#fff"/><rect x="27" y="110" width="46" height="3.4" fill="#000"/>';
    var sleeve = o.kid ? '#fff' : '#15151b';
    return '<svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg" style="--d:' + o.d + 's"><g class="fig">' +
      '<g class="leg-l"><path d="M44 140 L41 186" stroke="#15151b" stroke-width="9" stroke-linecap="round"/><ellipse cx="38" cy="189" rx="7.5" ry="4" fill="#000"/></g>' +
      '<g class="leg-r"><path d="M56 140 L59 186" stroke="#15151b" stroke-width="9" stroke-linecap="round"/><ellipse cx="62" cy="189" rx="7.5" ry="4" fill="#000"/></g>' +
      body +
      '<path d="M26 150 L25 168 M30 152 L30 171 M74 150 L75 168 M70 152 L70 171" stroke="#fff" stroke-width="1.3"/>' +
      '<g class="arm-l"><path d="M30 78 L15 42" stroke="' + sleeve + '" stroke-width="9" stroke-linecap="round"/><circle cx="14" cy="39" r="5" fill="' + o.skin + '"/></g>' +
      '<g class="arm-r"><path d="M70 78 L85 42" stroke="' + sleeve + '" stroke-width="9" stroke-linecap="round"/><circle cx="86" cy="39" r="5" fill="' + o.skin + '"/></g>' +
      '<circle cx="50" cy="56" r="13" fill="' + o.skin + '"/>' + beard +
      '<circle cx="45" cy="54" r="1.4" fill="#222"/><circle cx="55" cy="54" r="1.4" fill="#222"/>' +
      '<path d="M45 61 Q50 65 55 61" stroke="#8a3b2a" stroke-width="1.4" fill="none"/>' +
      hat + '</g></svg>';
  }

  var ring = document.getElementById('ring'), scene = document.getElementById('scene');
  var N = 10, people = [];
  for(var n = 0; n < N; n++){
    var kid = n % 4 === 3;
    var el = document.createElement('div');
    el.className = 'dancer';
    el.innerHTML = dancer({kid:kid, skin:SKIN[n%4], beard:BEARD[n%5], d:-(n*0.21).toFixed(2)});
    ring.appendChild(el);
    people.push({el:el, kid:kid, phase:n/N*Math.PI*2});
  }

  var t0 = null;
  function frame(ts){
    if(t0 === null) t0 = ts;
    var sec = (ts - t0)/1000;
    var w = scene.clientWidth, h = scene.clientHeight;
    var dh = h*0.36, cx = w/2, cy = h*0.66, rx = w*0.36, ry = h*0.12;
    people.forEach(function(p){
      var a = p.phase + sec*0.42;
      var depth = (Math.sin(a)+1)/2;                  /* 1 = קדימה, 0 = מאחור */
      var k = (0.6 + 0.4*depth) * (p.kid ? 0.78 : 1);
      var ph = dh*k, pw = ph/2;
      var x = cx + rx*Math.cos(a) - pw/2, y = cy + ry*Math.sin(a) - ph;
      p.el.style.width = pw + 'px'; p.el.style.height = ph + 'px';
      p.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      p.el.style.zIndex = Math.round(depth*100);
      p.el.style.filter = 'brightness(' + (0.55 + 0.45*depth).toFixed(2) + ')';
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* תווים עולים */
  var NOTES = ['♪','♫','♬','♩'], NC = ['#ffc93c','#3ee0d0','#ff5c8a','#fff4dc'];
  setInterval(function(){
    if(document.hidden) return;
    var n = document.createElement('span');
    n.className = 'note';
    n.textContent = NOTES[Math.floor(Math.random()*4)];
    n.style.left = (10 + Math.random()*80) + '%';
    n.style.top = (45 + Math.random()*35) + '%';
    n.style.fontSize = (3 + Math.random()*3.5) + 'vmin';
    n.style.color = NC[Math.floor(Math.random()*4)];
    n.style.setProperty('--dx', ((Math.random()-.5)*16) + 'vmin');
    n.style.setProperty('--rot', ((Math.random()-.5)*60) + 'deg');
    n.style.animationDuration = (3 + Math.random()*2.5) + 's';
    scene.appendChild(n);
    setTimeout(function(){ n.remove(); }, 6000);
  }, 380);

  /* מסך מלא: F או לחיצה כפולה */
  function fullscreen(){
    var d = document.documentElement;
    if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }
    else if(document.exitFullscreen){ document.exitFullscreen(); }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='f' || e.key==='F' || e.key==='כ') fullscreen(); });
  document.addEventListener('dblclick', fullscreen);
  var idleT;
  function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add('idle'); }, 3000); }
  document.addEventListener('mousemove', wake); wake();
})();
</script>
