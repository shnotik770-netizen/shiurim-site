<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הקפות שניות – בית הכנסת חב"ד המרכזי עפולה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#7d0f25;
    --wine-deep:#4f0715;
    --navy:#152a63;
    --navy-deep:#0c1a44;
    --gold:#d9a93b;
    --gold-soft:#f3d78a;
    --cream:#fffaf0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Heebo","Arial Hebrew",Arial,sans-serif;color:var(--navy);
    background:radial-gradient(ellipse at 50% 30%,#fffdf7 0,#fbf1dc 55%,#f1dcc0 100%)}
  body.idle{cursor:none}

  /* קרני אור */
  .rays{position:fixed;inset:-40%;pointer-events:none;opacity:.55;
    background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,236,190,.9) 0 4deg,transparent 4deg 13deg);
    -webkit-mask:radial-gradient(circle at 50% 50%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 50%,#000 0,transparent 55%);
    animation:spin 120s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(2px);
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,230,170,.35) 40%,transparent 70%);animation:shimmer 5s ease-in-out infinite}
  .glow.a{width:30vmin;height:30vmin;top:18%;left:-6vmin}
  .glow.b{width:22vmin;height:22vmin;top:-6vmin;right:18%;animation-delay:-2.5s}
  @keyframes shimmer{50%{opacity:.45;transform:scale(1.15)}}
  /* גל כחול בפינה */
  .wave{position:fixed;left:0;bottom:0;width:48vmin;height:30vmin;pointer-events:none}

  .bh{position:fixed;top:2.6vmin;right:3vmin;font-weight:800;font-size:2.4vmin;color:var(--navy-deep);z-index:5}

  .page{position:relative;z-index:2;height:100%;display:grid;
    grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"title title" "band band" "info photo";
    column-gap:4vmin;row-gap:2.2vmin;padding:3vmin 4vmin 4vmin}

  h1{grid-area:title;justify-self:center;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:19vmin;line-height:1;white-space:nowrap;
    background:linear-gradient(180deg,#b3213f 0%,var(--wine) 45%,var(--wine-deep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:.35vmin var(--gold);paint-order:stroke fill;
    filter:drop-shadow(0 .5vmin 0 #a8761c) drop-shadow(0 1.4vmin 1.6vmin rgba(80,20,10,.35))}

  /* סרט כחול עם קצוות מעוטרים */
  .band{grid-area:band;justify-self:center;position:relative;margin-top:.6vmin;padding:1.4vmin 9vmin 1.8vmin;
    font-weight:900;font-size:7vmin;line-height:1;color:#fff;white-space:nowrap;
    background:linear-gradient(180deg,#27418a 0%,var(--navy) 50%,var(--navy-deep) 100%);
    clip-path:polygon(4vmin 0,calc(100% - 4vmin) 0,100% 50%,calc(100% - 4vmin) 100%,4vmin 100%,0 50%);
    text-shadow:0 .4vmin 0 rgba(0,0,0,.35)}
  .band-wrap{grid-area:band;justify-self:center;position:relative;padding:.45vmin;margin-top:.4vmin;
    background:linear-gradient(90deg,#a8761c,var(--gold-soft),#a8761c);
    clip-path:polygon(4.3vmin 0,calc(100% - 4.3vmin) 0,100% 50%,calc(100% - 4.3vmin) 100%,4.3vmin 100%,0 50%);
    filter:drop-shadow(0 1vmin 1.6vmin rgba(12,26,68,.35))}
  .band-wrap .band{margin:0}
  .swoosh{display:block;width:60vmin;height:2.2vmin;margin:-.2vmin auto 0;grid-area:band;align-self:start;justify-self:center;transform:translateY(-2.6vmin)}

  .info{grid-area:info;align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.6vmin;min-width:0}
  .when b{display:block;font-weight:900;font-size:4.4vmin;line-height:1.2;color:var(--navy-deep)}
  .date{display:flex;align-items:center;gap:1.4vmin;font-weight:900;font-size:4.2vmin;color:var(--wine);margin-top:.4vmin}
  .date .ltr{direction:ltr;unicode-bidi:isolate}
  .date i{width:1.1vmin;height:1.1vmin;border-radius:50%;background:var(--navy);display:block}
  .div{display:flex;align-items:center;gap:1vmin;width:78%}
  .div::before,.div::after{content:"";flex:1;height:.25vmin;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .div span{width:1.3vmin;height:1.3vmin;border:.25vmin solid var(--gold);transform:rotate(45deg)}
  .where b{display:block;font-weight:900;font-size:4.4vmin;line-height:1.2;color:var(--navy-deep)}
  .where span{display:block;font-weight:700;font-size:3.1vmin;color:var(--navy)}
  .time{display:flex;align-items:baseline;gap:1.4vmin;padding:1vmin 4.4vmin;border-radius:10vmin;color:#fff;
    background:linear-gradient(180deg,#a3213d,var(--wine) 60%,var(--wine-deep));box-shadow:0 0 0 .35vmin var(--gold),0 1vmin 2vmin rgba(79,7,21,.35)}
  .time span{font-weight:800;font-size:3.4vmin}
  .time b{font-weight:900;font-size:4.6vmin;font-variant-numeric:tabular-nums}
  .invite{font-weight:900;font-size:3.3vmin;color:var(--navy-deep);padding:.9vmin 3.6vmin;
    background:linear-gradient(90deg,transparent,var(--gold-soft) 12%,#f7e3a6 50%,var(--gold-soft) 88%,transparent)}
  .joy{display:flex;align-items:center;gap:1.6vmin;font-weight:900;font-size:3.6vmin;color:var(--wine)}
  .joy::before,.joy::after{content:"";width:4vmin;height:.3vmin;background:var(--wine)}

  .photo{grid-area:photo;align-self:center;justify-self:stretch;position:relative;min-height:0;height:100%;max-height:100%;
    border-radius:4vmin;overflow:hidden;box-shadow:0 0 0 .5vmin #fff,0 0 0 .8vmin var(--gold),0 2.4vmin 4vmin rgba(60,30,10,.35)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 18s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,1%)}}

  @media (prefers-reduced-motion:reduce){ .rays,.glow,.photo img{animation:none} }

  /* מסך לאורך */
  @media (max-aspect-ratio:1/1){
    .page{grid-template-columns:1fr;grid-template-rows:auto auto auto minmax(0,1fr);
      grid-template-areas:"title" "band" "photo" "info";row-gap:3vmin;padding:6vmin 5vmin 5vmin}
    h1{font-size:18vmin}
    .band{font-size:6.2vmin;padding:1.4vmin 7vmin 1.8vmin}
    .photo{height:auto;aspect-ratio:5/3;max-height:none}
    .info{align-self:start;gap:2.4vmin}
    .when b,.where b{font-size:6vmin}
    .date{font-size:5.6vmin}
    .where span{font-size:4.4vmin}
    .time span{font-size:5vmin}.time b{font-size:7vmin}
    .invite{font-size:4.6vmin}
    .joy{font-size:5vmin}
    .wave{width:60vmin;height:14vmin}
  }
</style>
</head>

<script>
(function(){
  /* הכותרת והסרט לא גולשים מרוחב המסך */
  function fit(el){
    el.style.fontSize = '';
    var max = document.documentElement.clientWidth * 0.94, w = el.getBoundingClientRect().width;
    if(w > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w) + 'px';
  }
  function fitAll(){ fit(document.querySelector('h1')); fit(document.querySelector('.band')); }
  fitAll();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  window.addEventListener('resize', fitAll);

  /* מסך מלא: F או לחיצה כפולה */
  function fullscreen(){
    var d = document.documentElement;
    if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }
    else if(document.exitFullscreen){ document.exitFullscreen(); }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='f' || e.key==='F' || e.key==='כ') fullscreen(); });
  document.addEventListener('dblclick', fullscreen);
  var idleT;
  function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add('idle'); }, 3000); }
  document.addEventListener('mousemove', wake); wake();
})();
</script>
